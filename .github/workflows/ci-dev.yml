name: ci-dev

# Build all three images, push them to the dev ECR repos, then point the dev
# overlay at the new tag. Argo CD on the dev cluster syncs that commit.
on:
  push:
    branches: [main]
    paths:
      - "services/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, train-service, booking-service]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE="$ECR_REGISTRY/railway-dev/${{ matrix.service }}:$IMAGE_TAG"
          docker build -t "$IMAGE" "services/${{ matrix.service }}"
          docker push "$IMAGE"

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize if missing
        run: |
          if ! command -v kustomize >/dev/null; then
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/
          fi

      - name: Point the dev overlay at the new images
        working-directory: deploy/k8s/overlays/dev
        run: |
          for svc in frontend train-service booking-service; do
            kustomize edit set image "$svc=$ECR_REGISTRY/railway-dev/$svc:$IMAGE_TAG"
          done

      - name: Commit the new tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy ${IMAGE_TAG::7} to dev [skip ci]"
          git pull --rebase
          git push
