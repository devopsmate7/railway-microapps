# Apply on the prod cluster after Argo CD is installed:
#   kubectl apply -f deploy/argocd/railway-prod.yaml
# No automated sync: someone presses Sync in the Argo CD UI after the promotion commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: railway-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devopsmate7/railway-microapps.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: railway
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
